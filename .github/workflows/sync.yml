name: 课表同步

on:
  schedule:
    # UTC 0~14 点每小时一次 = 北京时间 8:00~22:00 每小时
    # GitHub 的 schedule 事件在高负载时会延迟甚至直接跳过（实测 4 次计划只跑了 1 次），
    # 因此用「更高频率」来提高容错率：漏掉一次，一小时后还有下一次。
    - cron: '0 0-14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 抓取并生成课表
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并生成课表
        env:
          JW_USERNAME: ${{ secrets.JW_USERNAME }}
          JW_PASSWORD: ${{ secrets.JW_PASSWORD }}
          JW_BASE_URL: ${{ secrets.JW_BASE_URL }}
          SEMESTER_START: ${{ vars.SEMESTER_START || '2026-09-07' }}
          SCHOOL_NAME: ${{ vars.SCHOOL_NAME || '正德职业技术学院' }}
          MIN_EVENTS: '60'
        run: python sync.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "课表同步 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 推送到订阅服务
        env:
          SUBSCRIBE_HOST: ${{ vars.SUBSCRIBE_HOST }}
        run: |
          if [ -z "$SUBSCRIBE_HOST" ]; then
            echo "::error::还没有配置 SUBSCRIBE_HOST（Settings → Variables），课表无法送达手机。"
            exit 1
          fi

          URL="${SUBSCRIBE_HOST%/}/update"

          # ⚠️ 必须显式检查 HTTP 状态码。
          # curl 默认不看状态码，云端返回 403 也照样 exit 0，
          # 于是流水线一片绿灯、手机端却拿不到数据 —— 2026-11-11 断了一周才被发现。
          status=$(curl -sS --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /tmp/push_reply.txt -w '%{http_code}' \
            -X POST "$URL" \
            -H "X-Update-Key: ${{ secrets.UPDATE_KEY }}" \
            -H "Content-Type: text/calendar" \
            --data-binary @calendar.ics) || true

          echo "推送目标: $URL"
          echo "推送响应 HTTP $status"
          head -c 300 /tmp/push_reply.txt 2>/dev/null || true
          echo

          if [ "$status" != "200" ]; then
            echo "::error::订阅服务拒绝接收数据（HTTP $status）。手机端拿不到新课表，请检查服务是否在线。"
            exit 1
          fi

          echo "订阅服务状态："
          curl -sS -f --max-time 30 "${SUBSCRIBE_HOST%/}/health?cb=$RANDOM"
